# hyprpm manifest. Lets anyone install with:
#
#   hyprpm add https://github.com/ManofJELLO/HyprWindowShade
#   hyprpm enable HyprWindowShade
#
# hyprpm clones this repo, runs the `build` steps below with PKG_CONFIG_PATH
# pointed at a header tree matching the user's running Hyprland, and loads the
# `output` artifact. See Makefile for why the compile flags are what they are.

[repository]
name = "HyprWindowShade"
authors = ["ManofJELLO"]

# commit_pins maps a Hyprland commit to a commit of THIS repo known to build
# against it, as ["<hyprland commit>", "<plugin commit>"].
#
# Measured, not assumed: on the CURRENT Hyprland, `hyprpm update` checks out the
# tip of the default branch and ignores these entirely. A pin is the fallback
# for someone on an OLDER Hyprland — it hands them a revision matching their
# headers instead of a HEAD that needs newer ones. That is why upstream's
# manifest carries one entry per Hyprland release rather than one per commit.
#
# So an entry is inert until main moves on to a newer Hyprland. The moment to
# set one is at that transition: pin the outgoing Hyprland release to the last
# commit verified against it, then leave it alone. There is nothing to gain from
# bumping a pin per commit.
commit_pins = [
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "d08a1125cf0ae5e852a4351c02e79ee9da6b8eff"], # 0.56.2 — last verified against this release
]

[HyprWindowShade]
description = "Per-window, per-layer and per-class fragment shaders, with open and close animations"
authors = ["ManofJELLO"]
output = "HyprWindowShade.so"
build = [
    "make all",
]
