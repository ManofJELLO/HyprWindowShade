# hyprpm manifest. Lets anyone install with:
#
#   hyprpm add https://github.com/ManofJELLO/HyprWindowShade
#   hyprpm enable HyprWindowShade
#
# hyprpm clones this repo, runs the `build` steps below with PKG_CONFIG_PATH
# pointed at a header tree matching the user's running Hyprland, and loads the
# `output` artifact. See Makefile for why the compile flags are what they are.

[repository]
name = "HyprWindowShade"
authors = ["ManofJELLO"]

# commit_pins maps a Hyprland commit to the commit of THIS repo known to build
# against it, as ["<hyprland commit>", "<plugin commit>"]. hyprpm uses it to
# check out a working revision instead of whatever HEAD happens to be, which is
# what makes `hyprpm update` safe across Hyprland releases.
#
# Each entry pins a plugin commit KNOWN TO BUILD against a given Hyprland
# commit, so `hyprpm update` checks out a working revision instead of whatever
# HEAD happens to be. Add a new pair whenever a Hyprland release needs a
# different revision of this plugin; leave the old ones in place so users on
# older compositors still resolve to something that builds.
commit_pins = [
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "76f8ad7d544d5963fa4a6157985710f28f0e29ac"], # 0.56.2
]

[HyprWindowShade]
description = "Per-window, per-layer and per-class fragment shaders, with open and close animations"
authors = ["ManofJELLO"]
output = "HyprWindowShade.so"
build = [
    "make all",
]
