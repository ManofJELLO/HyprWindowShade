# hyprpm manifest. Lets anyone install with:
#
#   hyprpm add https://github.com/ManofJELLO/HyprWindowShade
#   hyprpm enable HyprWindowShade
#
# hyprpm clones this repo, runs the `build` steps below with PKG_CONFIG_PATH
# pointed at a header tree matching the user's running Hyprland, and loads the
# `output` artifact. See Makefile for why the compile flags are what they are.

[repository]
name = "HyprWindowShade"
authors = ["ManofJELLO"]

# commit_pins maps a Hyprland commit to a commit of THIS repo known to build
# against it, as ["<hyprland commit>", "<plugin commit>"].
#
# A MATCHING PIN ALWAYS WINS, including on the Hyprland everyone is currently
# running. Per the Hyprland wiki: "if someone is running 0.33.1, hyprpm will
# reset your plugin to commit hash <...>", and "if no pin matches, latest git
# will be used" — latest git is the fallback for an unpinned Hyprland, never an
# override of a pin that matched. The wiki also recommends "a pin for each
# Hyprland release", so the entry for the current release is the normal case,
# not a special one.
#
# Practical consequence: THIS IS THE RELEASE SWITCH. Pushing to main does not
# ship anything to anyone whose Hyprland is pinned here — hyprpm reads this
# manifest from the default branch, then resets to the commit named below and
# builds that. Bump the pin when you want a release to reach users, and expect
# the bump itself to land one commit behind whatever it points at.
commit_pins = [
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "0d63f2ca3da108854bcf86fa52e770d662f2205f"], # 0.56.2
]

[HyprWindowShade]
description = "Per-window, per-layer and per-class fragment shaders, with open and close animations"
authors = ["ManofJELLO"]
output = "HyprWindowShade.so"
build = [
    "make all",
]
